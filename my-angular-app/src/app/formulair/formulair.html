<form #contactform="ngForm" (ngSubmit)="contact(contactform)">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" ngModel>
    <br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" ngModel><!-- [(ngModel)]="email" 
    required #email="ngModel" -->
    <label for="message">Message:</label>
    <textarea id="message" name="message" ngModel required></textarea>
    <label for="phone">Phone:</label>
    <input type="text" id="phone" name="phone" ngModel>
<input type="submit" value="Submit" [disabled]="contactform.invalid">
</form>
